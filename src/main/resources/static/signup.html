<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 서윤이와 진우 게시판</title>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Gamja Flower', sans-serif; 
            padding: 20px; 
            margin: 0; 
            /* 배경화면 */
            background-image: url('/images/시나모롤9.png'); 
            background-size: cover;       
            background-position: center;  
            background-attachment: fixed;
            
            /* 화면 중앙 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container { 
            width: 100%;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.9); /* 반투명 흰색 */
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); 
            text-align: center;
        }

        h1 { color: #4a6ee0; margin-bottom: 20px; font-size: 2.5rem; }
        p { margin-bottom: 30px; color: #666; font-size: 1.1rem; }

        /* 입력창 스타일 */
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        
        input { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #a8c0ff; /* 시나모롤 테두리 */
            border-radius: 10px; 
            box-sizing: border-box;
            font-family: 'Gamja Flower', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #4a6ee0; box-shadow: 0 0 5px #a8c0ff; }

        /* 버튼 스타일 */
        button { 
            width: 100%; 
            padding: 15px; 
            margin-top: 10px;
            border: none; 
            border-radius: 10px; 
            font-family: 'Gamja Flower', sans-serif;
            font-size: 1.2rem;
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s;
        }

        .btn-signup { background: #ff9aa2; color: white; } /* 분홍색 */
        .btn-signup:hover { background: #ff7e89; transform: scale(1.02); }

        .btn-login { background: #a8c0ff; color: white; margin-top: 15px; } /* 하늘색 */
        .btn-login:hover { background: #96b3ff; transform: scale(1.02); }

    </style>
</head>
<body>
    
    <div class="container">
        <h1>☁️ 회원가입 ☁️</h1>
        <p>우리만의 공간에 들어오려면 가입해! 💕</p>
        
        <div class="input-group">
            <label>아이디</label>
            <input type="text" id="userId" placeholder="영어 아이디를 입력해줘!">
        </div>
        
        <div class="input-group">
            <label>비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호 (까먹지마!)">
        </div>
        
        <div class="input-group">
            <label>닉네임</label>
            <input type="text" id="nickName" placeholder="예쁜 닉네임 (ex. 공주님)">
        </div>
        
        <button class="btn-signup" onclick="signup()">가입 완료! 🎉</button>
        <button class="btn-login" onclick="location.href='login.html'">이미 가입했어! (로그인)</button>
    </div>

    <script>
        function signup() {
            // 1. 입력값 가져오기
            const userId = document.getElementById("userId").value;
            const password = document.getElementById("password").value;
            const nickName = document.getElementById("nickName").value;

            // 2. 빈칸 검사
            if (!userId || !password || !nickName) {
                alert("빈칸이 있잖아! 꼼꼼하게 다 채워줘! 😡");
                return;
            }

            // 3. 서버로 전송
            fetch("/api/user/signup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    userId: userId,
                    password: password,
                    nickName: nickName
                })
            })
            .then(response => {
                if (response.ok) {
                    return response.text(); 
                } else {
                    throw new Error("이미 있는 아이디거나 뭔가 문제가 있어! 😢");
                }
            })
            .then(message => {
                alert("가입 성공! 이제 로그인하러 가자! ❤️"); 
                location.href = "login.html"; // 로그인 페이지로 이동
            })
            .catch(error => {
                alert(error.message);
            });
        }
    </script>
</body>
</html>
