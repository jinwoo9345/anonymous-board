<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>서윤이와 진우의 게시판</title>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gamja Flower', sans-serif;
            background-image: url('/images/시나모롤1.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #4a6ee0; margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #a8c0ff; color: white; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; color: #333; }
        
        /* ★ [핵심 변경 1] 마우스 올리면 색 변하고 손가락 모양 나오게! */
        tbody tr { 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        tbody tr:hover { 
            background-color: #e6f0ff; /* 마우스 올렸을 때 연한 하늘색 */
        }

        a { text-decoration: none; color: #333; font-weight: bold; }

        .btn-write { background: #ff9aa2; color: white; padding: 10px 20px; border-radius: 20px; border: none; font-size: 1.2rem; cursor: pointer; margin-top: 20px; font-family: 'Gamja Flower'; }
        .btn-logout { background: #ccc; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-family: 'Gamja Flower'; }
    </style>
</head>
<body>
    <div class="container">
        <h1>☁️ 서윤이와 진우의 비밀공간 ☁️</h1>
        
        <h3 id="welcomeMsg">로딩 중... 누구세요?</h3>
        <button class="btn-logout" onclick="logout()">로그아웃 (집에 갈래)</button>

        <table>
            <thead>
                <tr>
                    <th width="10%">번호</th>
                    <th width="50%">제목</th>
                    <th width="20%">누가 썼게?</th>
                    <th width="20%">언제?</th>
                </tr>
            </thead>
            <tbody id="board-list">
                </tbody>
        </table>

        <br>
        <button class="btn-write" onclick="location.href='write.html'">✏️ 나도 글 쓰러 가기!</button>
    </div>

    <script>
        // 1. 로그인 체크 & 환영 인사
        fetch("/api/user/info")
            .then(response => {
                if (!response.ok) {
                    alert("누구세요? 로그인 먼저 하고 와! 😠");
                    location.href = "login.html";
                }
                return response.json();
            })
            .then(user => {
                document.getElementById("welcomeMsg").innerHTML = 
                    `<span style="color:#4a6ee0; font-size:1.5rem;">${user.nickName}</span>님 왔구나! 환영해! 👋`;
            })
            .catch(() => location.href = "login.html");

        // 2. 게시글 목록 가져오기
        fetch("/api/board/list") 
            .then(res => res.json())
            .then(list => {
                const tbody = document.getElementById("board-list");
                tbody.innerHTML = ""; 

                if(list.length === 0) {
                    tbody.innerHTML = "<tr style='cursor: default;'><td colspan='4'>아직 글이 하나도 없어! 1등으로 써봐! 🥇</td></tr>";
                    return;
                }

                list.forEach(board => {
                    const date = board.createdAt ? board.createdAt.replace('T', ' ').substring(0, 16) : '-';
                    
                    // ★ [핵심 변경 2] tr 태그 자체에 onclick을 넣었습니다!
                    // 제목 <td> 안에 있던 <a href> 태그는 지웠습니다. (중복 방지)
                    const row = `
                        <tr onclick="location.href='detail.html?id=${board.id}'">
                            <td>${board.id}</td>
                            <td style="text-align: left; padding-left: 20px; font-weight: bold;">
                                ${board.title}
                            </td>
                            <td>${board.author}</td>
                            <td style="font-size: 0.9rem; color: #888;">${date}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            });

        function logout() {
            fetch("/api/user/logout", { method: "POST" })
                .then(() => {
                    alert("안녕! 또 와야해! 👋");
                    location.href = "login.html";
                });
        }
    </script>
</body>
</html>
