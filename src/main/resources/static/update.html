<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글 수정하기</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            margin: 0; /* 여백 초기화 */

            /* ▼ 배경화면 설정 */
            background-image: url('/images/시나모롤4.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* ▼ 내용을 감싸는 흰색 상자 스타일 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.6); /* 반투명 흰색 */
            border-radius: 15px;    /* 모서리 둥글게 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* 그림자 */
        }

        h2 { text-align: center; margin-bottom: 20px; color: #333; }

        /* 입력창 디자인 업그레이드 */
        input, textarea { 
            width: 100%; 
            margin-bottom: 15px; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #ddd; 
            border-radius: 8px; /* 둥글게 */
            font-size: 1rem;
        }

        /* 읽기 전용 필드 스타일 */
        .readonly { 
            background-color: #eee; 
            color: #666; 
            cursor: not-allowed; 
        }

        /* 버튼 디자인 업그레이드 */
        button { 
            width: 100%; 
            padding: 12px; 
            background: #ffc107; /* 수정 버튼은 노란색 유지 */
            color: black; 
            border: none; 
            border-radius: 8px; /* 둥글게 */
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: bold; 
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        button:hover { background: #e0a800; }

        .btn-cancel { 
            background: #6c757d; 
            color: white; 
            margin-top: 5px; 
        }
        .btn-cancel:hover { background: #5a6268; }
    </style>
</head>
<body>
    
    <div class="container">
        <h2>🛠️ 글 수정할래?</h2>
        
        <input type="text" id="id" class="readonly" readonly placeholder="번호">
        <input type="text" id="author" class="readonly" readonly placeholder="작성자">
        
        <input type="text" id="title" placeholder="제목">
        <input type="password" id="password" placeholder="비밀번호 (필수)" required> 
        <textarea id="content" rows="10" placeholder="내용을 입력하세요"></textarea>
        
        <button onclick="updatePost()">수정 완료</button>
        <button onclick="history.back()" class="btn-cancel">취소</button>
    </div>

    <script>
        // 1. 주소창에서 ID 가져오기
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
            alert("잘못된 접근이야!!!");
            location.href = "list.html";
        }

        // 2. 기존 데이터 불러와서 채워넣기
        window.onload = async () => {
            try {
                const response = await fetch(`/api/board/${id}`);
                const board = await response.json();

                document.getElementById('id').value = board.id;
                document.getElementById('author').value = board.author;
                document.getElementById('title').value = board.title;
                document.getElementById('content').value = board.content;
            } catch (e) {
                console.error(e);
                alert("글 정보를 불러오는데 실패했지롱~~메롱!");
            }
        };

        // 3. 수정 요청 보내기 (비밀번호 포함)
        async function updatePost() {
            const data = {
                title: document.getElementById('title').value,
                content: document.getElementById('content').value,
                password: document.getElementById('password').value // 비밀번호 추가
            };

            if (!data.password) {
                alert("비밀번호를 입력해!!!까먹었으면 안되지롱ㅋ");
                return;
            }

            try {
                const response = await fetch(`/api/board/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert("수정 완료~~~");
                    location.href = `detail.html?id=${id}`;
                } else {
                    alert("수정 실패!!! 비밀번호 까무것엉!?");
                }
            } catch (e) {
                console.error(e);
                alert("서버 오류 났잖아!!");
            }
        }
    </script>
</body>
</html>
