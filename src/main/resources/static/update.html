<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글 수정하기 - 서윤이와 진우 게시판</title>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Gamja Flower', sans-serif; 
            padding: 20px; 
            margin: 0; 
            /* 배경화면 (4번 이미지 유지!) */
            background-image: url('/images/시나모롤4.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.9); /* 가독성 위해 투명도 조절 */
            border-radius: 20px;    
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
            text-align: center;
        }

        h2 { margin-bottom: 20px; color: #333; font-size: 2rem; }

        /* 입력창 디자인 */
        input, textarea { 
            width: 100%; 
            margin-bottom: 15px; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 2px solid #ffc107; /* 수정 모드는 노란색 포인트 */
            border-radius: 10px; 
            font-family: 'Gamja Flower', sans-serif;
            font-size: 1.1rem;
            outline: none;
        }
        
        textarea { resize: vertical; }

        /* 버튼 디자인 */
        button { 
            width: 100%; 
            padding: 12px; 
            color: #333; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 1.2rem; 
            font-weight: bold; 
            transition: 0.3s;
            font-family: 'Gamja Flower', sans-serif;
            margin-bottom: 10px;
        }
        
        .btn-update { background: #ffc107; } /* 노란색 */
        .btn-update:hover { background: #e0a800; transform: scale(1.02); }
        
        .btn-cancel { background: #ddd; color: #555; }
        .btn-cancel:hover { background: #ccc; }

        .btn-home { background: #a8c0ff; color: white; margin-top: 20px;}
        .btn-home:hover { background: #96b3ff; }

    </style>
</head>
<body>
    
    <div class="container">
        <h2>✏️ 글 고쳐쓰기 (수정)</h2>
        
        <input type="text" id="title" placeholder="제목 불러오는 중...">
        
        <textarea id="content" rows="12" placeholder="내용 불러오는 중..."></textarea>
        
        <button class="btn-update" onclick="updatePost()">수정 완료! ✨</button>
        <button class="btn-cancel" onclick="history.back()">취소하고 돌아가기</button>
        <button class="btn-home" onclick="location.href='index.html'">🏠 홈으로 가기</button>
    </div>

    <script>
        // 주소창에서 id 가져오기
        const params = new URLSearchParams(window.location.search);
        const boardId = params.get("id");

        // 1. 들어오자마자 기존 글 내용 불러오기
        window.onload = async function() {
            if(!boardId) {
                alert("잘못된 접근이야! (ID가 없어)");
                location.href = "index.html";
                return;
            }

            try {
                // 기존 글 정보 가져오기
                const response = await fetch(`/api/board/${boardId}`);
                if(response.ok) {
                    const board = await response.json();
                    document.getElementById("title").value = board.title;
                    document.getElementById("content").value = board.content;
                } else {
                    throw new Error("글 정보를 못 가져왔어 ㅠㅠ");
                }
            } catch (err) {
                alert(err.message);
                location.href = "index.html";
            }
        };

        // 2. 수정 버튼 누르면 서버로 전송 (PUT)
        async function updatePost() {
            const title = document.getElementById("title").value;
            const content = document.getElementById("content").value;

            if(!title || !content) {
                alert("내용을 비우면 안돼! 😡");
                return;
            }

            try {
                // ★ 핵심: 주소를 컨트롤러(@PutMapping)와 맞춤: /api/board/update/{id}
                const response = await fetch(`/api/board/update/${boardId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        title: title,
                        content: content
                        // password는 안 보냄!
                    })
                });

                const msg = await response.text();
                
                if (response.ok) {
                    alert("수정 완료! ✨"); 
                    // 수정 성공하면 상세 페이지로 돌아가기
                    location.href = `detail.html?id=${boardId}`;
                } else {
                    // 서버가 에러 메시지("작성자만 수정 가능합니다")를 보내줌
                    alert(msg); 
                }
            } catch (err) {
                console.error(err);
                alert("서버 연결 오류! 로그인 상태를 확인해봐.");
            }
        }
    </script>
</body>
</html>
