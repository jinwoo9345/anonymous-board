<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세 - 서윤이와 진우</title>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gamja Flower', sans-serif;
            padding: 20px;
            background-image: url('/images/시나모롤2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #333; border-bottom: 2px solid #a8c0ff; padding-bottom: 10px; }
        
        .post-info { color: #666; font-size: 0.9rem; margin-bottom: 20px; text-align: right; }
        
        #content { 
            min-height: 200px; 
            padding: 20px; 
            background: #f9f9f9; 
            border-radius: 10px; 
            white-space: pre-wrap; /* 줄바꿈 유지 */
            font-size: 1.1rem;
        }

        /* 버튼 스타일 */
        .btn-group { margin-top: 20px; text-align: right; }
        button { padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-family: 'Gamja Flower'; font-size: 1.1rem; font-weight: bold; margin-left: 5px; }
        .btn-list { background: #a8c0ff; color: white; }
        .btn-update { background: #ffc107; color: black; }
        .btn-delete { background: #ff6b6b; color: white; }

        /* 댓글 영역 스타일 */
        .comment-section { margin-top: 40px; border-top: 2px dashed #ddd; padding-top: 20px; }
        .comment-input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .comment-input-box textarea { flex-grow: 1; padding: 10px; border-radius: 10px; border: 1px solid #ddd; resize: none; font-family: 'Gamja Flower'; }
        .btn-comment-save { background: #4a6ee0; color: white; width: 80px; }

        /* 댓글 리스트 스타일 */
        .comment-item { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .comment-content { font-size: 1.1rem; }
        .comment-meta { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        /* 수정/삭제 버튼은 작게 */
        .comment-buttons button { padding: 5px 10px; font-size: 0.9rem; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="title">제목 불러오는 중...</h2>
        <div class="post-info">
            작성자: <span id="author">-</span> | 작성일: <span id="date">-</span>
        </div>
        <div id="content">내용 불러오는 중...</div>

        <div class="btn-group">
            <button class="btn-list" onclick="location.href='index.html'">목록으로</button>
            <button id="btn-update-post" class="btn-update" style="display:none;" onclick="goToUpdate()">수정</button>
            <button id="btn-delete-post" class="btn-delete" style="display:none;" onclick="deletePost()">삭제</button>
        </div>

        <div class="comment-section">
            <h3>💬 댓글 (<span id="comment-count">0</span>)</h3>
            
            <div class="comment-input-box">
                <textarea id="comment-content" rows="2" placeholder="예쁜 댓글을 남겨주세요!"></textarea>
                <button class="btn-comment-save" onclick="saveComment()">등록</button>
            </div>

            <div id="comment-list"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const boardId = params.get("id");
        let currentUserNickName = null; // 현재 로그인한 사람 닉네임 저장용

        // 1. 페이지 로딩 시 실행
        window.onload = async function() {
            if(!boardId) {
                alert("잘못된 접근입니다.");
                location.href = "index.html";
                return;
            }

            // (1) 내 정보 먼저 확인 (로그인 했는지?)
            await checkLoginUser();

            // (2) 게시글 내용 불러오기
            loadBoardDetail();

            // (3) 댓글 목록 불러오기
            loadComments();
        };

        // 로그인 유저 확인 함수
        async function checkLoginUser() {
            try {
                const res = await fetch("/api/user/info"); // 유저 정보 달라는 API (만들어뒀다고 가정)
                if(res.ok) {
                    const user = await res.json();
                    currentUserNickName = user.nickName; // 내 닉네임 저장
                    console.log("현재 접속자:", currentUserNickName);
                } else {
                    console.log("로그인 안 한 상태");
                }
            } catch (e) {
                console.log("로그인 체크 실패");
            }
        }

        // 게시글 불러오기
        function loadBoardDetail() {
            fetch(`/api/board/${boardId}`)
                .then(res => res.json())
                .then(board => {
                    document.getElementById("title").innerText = board.title;
                    document.getElementById("author").innerText = board.author;
                    document.getElementById("date").innerText = board.createdAt.replace('T', ' ').substring(0, 16);
                    document.getElementById("content").innerText = board.content;

                    // ★ 게시글 주인이 '나'라면 수정/삭제 버튼 보여주기
                    if(currentUserNickName && currentUserNickName === board.author) {
                        document.getElementById("btn-update-post").style.display = "inline-block";
                        document.getElementById("btn-delete-post").style.display = "inline-block";
                    }
                });
        }

        // ============================
        // ★ 댓글 관련 기능 (핵심)
        // ============================

        // 1. 댓글 목록 조회
        function loadComments() {
            fetch(`/api/comment/list?boardId=${boardId}`)
                .then(res => res.json())
                .then(list => {
                    document.getElementById("comment-count").innerText = list.length;
                    const listArea = document.getElementById("comment-list");
                    listArea.innerHTML = ""; // 초기화

                    list.forEach(comment => {
                        // 댓글 주인이 '나'인지 확인
                        const isMyComment = (currentUserNickName && currentUserNickName === comment.author);
                        
                        // 내가 쓴 댓글에만 [수정/삭제] 버튼 보이기
                        let buttons = "";
                        if(isMyComment) {
                            buttons = `
                                <div class="comment-buttons">
                                    <button class="btn-update" onclick="updateComment(${comment.id}, '${comment.content}')">수정</button>
                                    <button class="btn-delete" onclick="deleteComment(${comment.id})">삭제</button>
                                </div>
                            `;
                        }

                        // HTML 조립 (CSR 방식!)
                        const html = `
                            <div class="comment-item">
                                <div>
                                    <div class="comment-meta">
                                        <b>${comment.author}</b> | ${comment.createdAt.replace('T', ' ').substring(0, 16)}
                                    </div>
                                    <div class="comment-content">${comment.content}</div>
                                </div>
                                ${buttons}
                            </div>
                        `;
                        listArea.innerHTML += html;
                    });
                });
        }

        // 2. 댓글 작성
        function saveComment() {
            if(!currentUserNickName) {
                alert("로그인 먼저 해주세요!");
                location.href = "login.html";
                return;
            }

            const content = document.getElementById("comment-content").value;
            if(!content) { alert("내용을 입력해!"); return; }

            fetch("/api/comment/create", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    boardId: boardId,
                    content: content
                })
            })
            .then(res => res.json())
            .then(() => {
                alert("댓글 등록 완료!");
                document.getElementById("comment-content").value = ""; // 입력칸 비우기
                loadComments(); // 목록 새로고침
            })
            .catch(err => alert("에러 발생!"));
        }

        // 3. 댓글 삭제 (DELETE /api/comment/{id})
        function deleteComment(commentId) {
            if(!confirm("진짜 삭제할 거야?")) return;

            fetch(`/api/comment/${commentId}`, { 
                method: "DELETE" 
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg); // "삭제 성공!"
                loadComments(); // 목록 새로고침
            });
        }

        // 4. 댓글 수정 (PUT /api/comment/{id})
        function updateComment(commentId, oldContent) {
            // 간단하게 prompt 창 띄워서 수정
            const newContent = prompt("수정할 내용을 입력해줘:", oldContent);
            
            if(newContent === null) return; // 취소 누름
            if(!newContent) { alert("내용이 비었어!"); return; }

            fetch(`/api/comment/${commentId}`, { 
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: newContent })
            })
            .then(res => res.text()) // "수정 완료!" 문자열 받기
            .then(msg => {
                alert(msg);
                loadComments(); // 목록 새로고침
            });
        }

        // 게시글 수정 페이지 이동
        function goToUpdate() { location.href = `update.html?id=${boardId}`; }
        
        // 게시글 삭제 (기존 로직 유지)
        function deletePost() {
             if(!confirm("정말 게시글을 삭제할까요?")) return;
             
             fetch(`/api/board/${boardId}`, { method: "DELETE" })
                 .then(res => {
                     if(res.ok) {
                         alert("게시글 삭제 완료!");
                         location.href = "index.html";
                     } else {
                         alert("삭제 권한이 없거나 실패했습니다.");
                     }
                 });
        }
    </script>
</body>
</html>
