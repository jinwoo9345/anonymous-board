<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글쓰기 - 서윤이와 진우 게시판</title>
    <style>
        body { 
            font-family: 'Gamja Flower', sans-serif; /* 귀여운 폰트 추천 (없으면 기본) */
            padding: 20px; 
            margin: 0; 
            
            /* ▼ 배경화면 설정 (유지!) */
            background-image: url('/images/시나모롤3.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* ▼ 내용을 감싸는 흰색 상자 스타일 (유지!) */
        .container {
            max-width: 600px;
            margin: 50px auto; /* 중앙 정렬을 위해 위쪽 여백 조금 추가 */
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.85); /* 글씨 잘 보이게 투명도 살짝 조절 */
            border-radius: 15px;    
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
            text-align: center;
        }

        h2 { margin-bottom: 20px; color: #333; }

        /* 입력창 디자인 */
        input, textarea { 
            width: 100%; 
            margin-bottom: 15px; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 2px solid #a8c0ff; /* 시나모롤 색상 테두리 */
            border-radius: 8px; 
            font-size: 1rem;
        }
        
        textarea { resize: vertical; } /* 세로로만 늘어나게 */

        /* 버튼 디자인 */
        button { 
            width: 100%; 
            padding: 12px; 
            background: #4a6ee0; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: bold; 
            transition: 0.3s;
        }
        button:hover { background: #3b5bc4; transform: scale(1.02); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="container">
        <h2>✏️ 서윤이와 진우의 비밀 게시판</h2>
        
        <input type="text" id="title" placeholder="제목 입력하라구!! (안쓰면 혼나!)" required>
        
        <textarea id="content" rows="12" placeholder="내용을 입력해!! 바보 서윤이야!! &#13;&#10;(여기에 하고 싶은 말 다 적어봐 ㅎㅎ)"></textarea>
        
        <button onclick="writePost()">등록하기!! ❤️</button>
        <br><br>
        <a href="index.html" style="text-decoration: none; color: #666;">취소하고 돌아가기</a>
    </div>

    <script>
        // 페이지 들어오자마자 로그인 했는지 살짝 체크
        fetch("/api/user/info")
            .then(res => {
                if(!res.ok) {
                    alert("로그인 먼저 하고 와야지!! 😠");
                    location.href = "login.html";
                }
            });

        async function writePost() {
            // 1. 입력한 값 가져오기 (제목, 내용만!)
            const titleVal = document.getElementById('title').value;
            const contentVal = document.getElementById('content').value;

            if(!titleVal || !contentVal) {
                alert("빈칸이 있잖아! 똑바로 써줘! 😡");
                return;
            }

            const data = {
                title: titleVal,
                content: contentVal
                // author, password는 이제 안 보냄!
            };

            // 2. 서버로 보내기 (POST)
            try {
                const response = await fetch('/api/board/write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data) 
                });

                // 3. 결과 처리
                if (response.ok) {
                    const msg = await response.text();
                    alert(msg); // "게시글 작성이 완료되었습니다!"
                    location.href = "index.html"; // 목록 페이지(index.html)로 이동
                } else {
                    alert("등록 실패! 로그인은 되어있는거야?");
                }
            } catch (error) {
                console.error(error);
                alert("서버 연결 오류!");
            }
        }
    </script>
</body>
</html>
