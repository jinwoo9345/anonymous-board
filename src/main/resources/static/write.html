<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글쓰기 - 게시판</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            margin: 0; /* 여백 초기화 */

            /* ▼ 배경화면 설정 */
            background-image: url('/images/시나모롤3.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* ▼ 내용을 감싸는 흰색 상자 스타일 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.7); /* 반투명 흰색 */
            border-radius: 15px;    /* 모서리 둥글게 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* 그림자 */
        }

        h2 { text-align: center; margin-bottom: 20px; color: #333; }

        /* 입력창 디자인 업그레이드 */
        input, textarea { 
            width: 100%; 
            margin-bottom: 15px; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #ddd; 
            border-radius: 8px; /* 둥글게 */
        }

        /* 버튼 디자인 업그레이드 */
        button { 
            width: 100%; 
            padding: 12px; 
            background: #4a6ee0; 
            color: white; 
            border: none; 
            border-radius: 8px; /* 둥글게 */
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: bold; 
        }
        button:hover { background: #3b5bc4; }
    </style>
</head>
<body>
    
    <div class="container">
        <h2>✏️  게시판 글쓰기</h2>
        
        <input type="text" id="title" placeholder="제목입력!!" required>
        <input type="text" id="author" placeholder="작성자 (익명)" required>
        <input type="password" id="password" placeholder="비밀번호 (나중에 수정/삭제용)까먹으면 안됩니다!" required>
        <textarea id="content" rows="10" placeholder="내용을 입력해!"></textarea>
        
        <button onclick="writePost()">등록하기!!</button>
    </div>

    <script>
        async function writePost() {
            // 1. 입력한 값 가져오기
            const data = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                password: document.getElementById('password').value,
                content: document.getElementById('content').value
            };

            // 2. 서버로 보내기 (POST)
            try {
                const response = await fetch('/api/board/write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data) 
                });

                // 3. 결과 처리
                if (response.ok) {
                    alert("글 등록 성공!!");
                    location.href = "list.html"; 
                } else {
                    alert("등록 실패!");
                }
            } catch (error) {
                console.error(error);
                alert("서버 연결 오류!");
            }
        }
    </script>
</body>
</html>
